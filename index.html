<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02 — Fundamentos Web.</title>
</head>
<body>
    <h1>Exercicio 2</h1>
    <img src="hive.jpeg" alt="logotipo hive festival">
    <iframe src="https://www.youtube.com/embed/RYh8_uw45Fw?controls=1"
        title="broncos x chiefs"
        width="560" height="315"
        allowfullscreen>
    </iframe>

    <h2>Exercicio 3 <br>contactos</h2>
    <form action="/enviar" method="post">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required minlength="3">
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
            <label for="telemovel">Telemóvel:</label>
            <input type="tel" id="telemovel" name="telemovel" required
               pattern="[0-9]{9}" title="9 dígitos, sem espaços">
        </p>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
